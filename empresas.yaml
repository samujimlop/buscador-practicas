# Lista de empresas que vigila el buscador.
#
# Campos:
#   nombre       como queremos que salga en la web
#   sector       para el filtro de la web
#   plataforma   qué conector usar: greenhouse, successfactors, workday...
#                "manual"    = la plataforma bloquea las peticiones automáticas:
#                              la web enseña el enlace para mirarlo a mano
#                "pendiente" = aún no hay conector (se salta)
#   web          página de empleo para mirar a mano
#   + los parámetros que necesite su conector (ver el docstring de cada conector)
#
# Plataformas detectadas el 2026-11-25 con herramientas/detectar_plataformas.py

