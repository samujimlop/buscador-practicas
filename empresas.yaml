# Lista de empresas que vigila el buscador.
#
# Campos:
#   nombre       como queremos que salga en la web
#   sector       para el filtro de la web
#   plataforma   qué conector usar: greenhouse, workday, lever, successfactors...
#                "pendiente" = aún no sabemos o aún no hay conector (se salta)
#   web          página de empleo, para ir a mirar a mano
#   verificado   true cuando alguien ha comprobado que la configuración funciona
#   + los parámetros que necesite su conector (p. ej. `board` en Greenhouse)
#
# Cómo averiguar la plataforma de una empresa: abre su página de ofertas,
# pulsa F12 > pestaña Red (Network) > filtra por Fetch/XHR y recarga. Mira a
# qué dominio llaman: myworkdayjobs.com = Workday, greenhouse.io = Greenhouse,
# lever.co = Lever, successfactors.* o "career" + "jobreq" = SuccessFactors...

empresas:
  # --- Greenhouse (ya hay conector). Los "board" están sin verificar. -------
  - nombre: Cabify
    sector: Tecnología
    plataforma: greenhouse
    board: cabify
    verificado: false
  - nombre: Glovo
    sector: Tecnología
    plataforma: greenhouse
    board: glovo
    verificado: false
  - nombre: Typeform
    sector: Tecnología
    plataforma: greenhouse
    board: typeform
    verificado: false

