# Cada mañana: ejecuta el buscador, guarda docs/ofertas.json y publica la web.
name: Actualizar ofertas

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 07:30 en Madrid (08:30 en verano)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  repository_dispatch:
    types: [buscar]         # /buscar en Telegram (lo lanza webhook/worker.js)
  push:
    branches: [main]
  pull_request:             # en los PR solo se pasan los tests

permissions:
  contents: write   # para guardar ofertas.json en el repo
  pages: write
  id-token: write

concurrency:
  group: escribir-repo   # el mismo que respuestas.yml: nunca escriben a la vez
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  actualizar:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # La última versión de main, no la del momento en que se lanzó.
          # Si dos búsquedas se ponen en fila, la segunda parte de lo que
          # guardó la primera y no hay conflicto en ofertas.json.
          ref: main
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Buscar ofertas (y avisar por Telegram de las nuevas)
        run: python -m buscador.main
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar ofertas.json en el repo (historial y fechas de "nueva")
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ofertas.json
          git diff --cached --quiet || git commit -m "Actualizar ofertas $(date -u +%F)"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
