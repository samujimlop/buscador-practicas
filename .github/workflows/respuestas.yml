# Procesa lo que haces en Telegram (botones Sí/No, tu CV en PDF).
# - Al momento: el worker de Cloudflare (webhook/worker.js) lo lanza con
#   repository_dispatch y le pasa tu mensaje.
# - De reserva, cada 30 minutos: pregunta a Telegram (polling). Si el webhook
#   está activo, esta parte no hace nada.
name: Leer respuestas de Telegram

on:
  schedule:
    - cron: "*/30 6-22 * * *"   # cada 30 min, de 07:00 a 23:30 hora de Madrid (invierno)
  workflow_dispatch:              # para probarlo a mano sin esperar
  repository_dispatch:
    types: [telegram]             # lo lanza el worker en cuanto pulsas algo

permissions:
  contents: write   # guarda data/decisiones/ y data/telegram_offset.json

# Sin "concurrency": si pulsas Sí en tres ofertas seguidas, queremos las tres
# ejecuciones (con concurrency, GitHub cancelaría las que esperan en cola).
# No chocan al guardar porque cada decisión va en su propio fichero.

jobs:
  respuestas:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # escribir cartas con Claude tarda un poco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Procesar clics
        run: python -m buscador.respuestas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # para escribir la carta
          CV_TEXTO: ${{ secrets.CV_TEXTO }}                     # opcional: si no, usa el PDF de Telegram
          PERFIL_NOTAS: ${{ secrets.PERFIL_NOTAS }}             # opcional: qué destacar
          CARTA_LUGAR: ${{ secrets.CARTA_LUGAR }}               # opcional: ciudad junto a la fecha
      - name: Guardar decisiones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet && exit 0
          git commit -m "Respuestas de Telegram"
          # Si otra ejecución guardó justo antes, traemos sus cambios y reintentamos.
          for intento in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((intento * 5))
          done
          exit 1
