# Cada 30 minutos: mira qué botones has pulsado en Telegram y actúa.
# (GitHub Actions no puede "escuchar" en tiempo real; esto se llama polling.)
name: Leer respuestas de Telegram

on:
  schedule:
    - cron: "*/30 6-22 * * *"   # cada 30 min, de 07:00 a 23:30 hora de Madrid (invierno)
  workflow_dispatch:              # para probarlo a mano sin esperar

permissions:
  contents: write   # guarda data/decisiones.json y data/telegram_offset.json

concurrency:
  group: escribir-repo
  cancel-in-progress: false

jobs:
  respuestas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Procesar clics
        run: python -m buscador.respuestas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # para la carta (issue pendiente)
      - name: Guardar decisiones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Respuestas de Telegram" && git pull --rebase && git push)
