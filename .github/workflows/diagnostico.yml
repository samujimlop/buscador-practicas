# Workflow manual para probar conectores contra las webs reales sin guardar nada.
name: Probar conectores
on:
  workflow_dispatch:
  push:
    branches: [conectores-grandes]
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m herramientas.probar_conectores
