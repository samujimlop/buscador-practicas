name: Diagnostico plataformas
on:
  push:
    branches: [diagnostico]
jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python herramientas/detectar_plataformas.py
